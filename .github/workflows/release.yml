name: Release

# Push a tag like v0.2.0 to build, package and publish a release.
# Run it manually (Actions → Release → Run workflow) to build the packages without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' Digby.xcodeproj/project.pbxproj | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"
            exit 1
          fi

      # Optional: with these secrets set, the release is signed with a Developer ID and notarized,
      # so it opens without a Gatekeeper prompt. Without them it is signed ad-hoc.
      #   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD  password of that .p12
      #   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing secrets; building an ad-hoc signed release."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "identity=$MACOS_SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials digby --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "notary=digby" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_PROFILE: ${{ steps.signing.outputs.notary }}
        run: scripts/release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Digby-${{ github.ref_name }}
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.signing.outputs.notary }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          sed "s/{{VERSION}}/$version/g" .github/release-notes.md > "$notes"
          if [ -n "$NOTARIZED" ]; then
            # Notarized builds open without a Gatekeeper prompt; drop the workaround section.
            sed -i '' '/<!-- unsigned -->/,/<!-- \/unsigned -->/d' "$notes"
          fi
          { echo; echo '## Checksums (SHA-256)'; echo; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } >> "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Digby $version" --notes-file "$notes" --generate-notes
          fi
